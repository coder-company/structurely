[package]
name = "structurely"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first semantic code intelligence for coding agents"
repository = "https://github.com/coder-company/structurely"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
