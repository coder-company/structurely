name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Native runner to probe without publishing a release
        required: true
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - macos-latest
          - macos-15-intel
          - ubuntu-latest

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: target/release/structurely
          - name: macos-aarch64
            os: macos-latest
            binary: target/release/structurely
          - name: macos-x86_64
            os: macos-15-intel
            binary: target/release/structurely
          - name: windows-x86_64
            os: windows-latest
            binary: target/release/structurely.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test locked source
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify Windows installer round-trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installer.ps1 -Binary "${{ matrix.binary }}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/package-unix.sh \
            "${{ matrix.binary }}" \
            "${{ matrix.name }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, package
          Copy-Item "${{ matrix.binary }}" package/structurely.exe
          Copy-Item README.md, LICENSE package/
          Compress-Archive `
            -Path package/* `
            -DestinationPath "dist/structurely-${{ matrix.name }}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: structurely-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: structurely-*
          merge-multiple: true
          path: release

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum structurely-* > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: release/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Structurely $GITHUB_REF_NAME"

  probe:
    name: Probe ${{ inputs.runner }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test locked source
        run: |
          cargo test state::backup::tests --locked
          cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify Windows installer round-trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installer.ps1 -Binary target/release/structurely.exe
