name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Check Unix installer
        if: runner.os == 'Linux'
        run: sh -n scripts/install.sh

      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }

      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --lib --bins --test mcp_cli_contract --locked

      - name: Verify daemon lifecycle
        run: cargo test --test daemon_cli --locked -- --nocapture

      - name: Verify semantic quality fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -- init fixtures/semantic
          cargo run --locked -- quality \
            --path fixtures/semantic \
            --manifest fixtures/semantic/quality.json

      - name: Enforce incremental visibility budget
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          source = pathlib.Path("fixtures/semantic/main.ts")
          source.write_text(source.read_text() + "\n// incremental CI edit\n")
          result = subprocess.run(
              ["cargo", "run", "--quiet", "--locked", "--", "sync", "fixtures/semantic"],
              check=True,
              capture_output=True,
              text=True,
          )
          report = json.loads(result.stdout)
          assert report["files_changed"] == 1, report
          assert report["duration_ms"] <= 300, report
          print(json.dumps(report, indent=2))
          PY

      - name: Test benchmark comparator
        if: runner.os == 'Linux'
        run: python3 -m unittest scripts/test_compare_benchmarks.py

      - name: Check documentation
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py

      - name: Build release binary
        run: cargo build --release --locked
