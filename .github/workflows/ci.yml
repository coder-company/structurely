name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: palantir-actions
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Unix installer
        run: sh -n scripts/install.sh

      - name: Check dashboard shell
        run: |
          node --check dashboard/app.js
          python3 scripts/test_dashboard_ui.py

      - name: Verify dashboard in Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
          npm run test:dashboard

      - name: Audit dependencies, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check

      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Verify daemon lifecycle
        run: cargo test --test daemon_cli --locked -- --nocapture

      - name: Verify private dashboard contract
        run: cargo test --test dashboard_cli --locked -- --nocapture

      - name: Verify semantic quality fixture
        shell: bash
        run: |
          cargo run --locked -- init fixtures/semantic
          cargo run --locked -- quality \
            --path fixtures/semantic \
            --manifest fixtures/semantic/quality.json

      - name: Enforce incremental visibility budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          source = pathlib.Path("fixtures/semantic/main.ts")
          source.write_text(source.read_text() + "\n// incremental CI edit\n")
          result = subprocess.run(
              ["cargo", "run", "--quiet", "--locked", "--", "sync", "fixtures/semantic"],
              check=True,
              capture_output=True,
              text=True,
          )
          report = json.loads(result.stdout)
          print(json.dumps(report, indent=2))
          assert report["files_changed"] == 1, report
          assert report["symbols_changed"] == 0, report
          assert report["relationships_resolved"] == 0, report
          assert report["resolution_ms"] == 0, report
          # This includes SQLite durability on the self-hosted runner's
          # network-backed disk. Pinned real-repository wall budgets provide
          # the tighter performance evidence.
          assert report["duration_ms"] <= 1000, report
          PY

      - name: Test benchmark comparator
        run: python3 -m unittest scripts/test_compare_benchmarks.py

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify live dashboard workflow in Chromium
        run: |
          STRUCTURELY_TEST_BINARY=target/release/structurely \
            npm run test:dashboard:live

      - name: Enforce dashboard bridge budget
        run: |
          target/release/structurely init . >/dev/null
          python3 scripts/benchmark_dashboard.py \
            --binary target/release/structurely \
            --project . \
            --output /tmp/structurely-dashboard-benchmark.json

      - name: Verify native installer round-trip
        run: python3 scripts/test_installer.py --binary target/release/structurely

      - name: Enforce Perseus retrieval advantage
        run: |
          python3 scripts/benchmark_perseus_acceptance.py \
            --structurely target/release/structurely \
            --project . \
            --output /tmp/structurely-perseus-acceptance.json

      - name: Enforce broad search-quality contract
        run: |
          python3 scripts/search_quality.py \
            --structurely target/release/structurely \
            --project . \
            --output /tmp/structurely-search-quality.json
