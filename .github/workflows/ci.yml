name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Verify semantic quality fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -- init fixtures/semantic
          cargo run --locked -- quality \
            --path fixtures/semantic \
            --manifest fixtures/semantic/quality.json

      - name: Build release binary
        run: cargo build --release --locked
