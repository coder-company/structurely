name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: palantir-actions
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64, palantir-actions]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Unix installer
        run: sh -n scripts/install.sh

      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Verify daemon lifecycle
        run: cargo test --test daemon_cli --locked -- --nocapture

      - name: Verify semantic quality fixture
        shell: bash
        run: |
          cargo run --locked -- init fixtures/semantic
          cargo run --locked -- quality \
            --path fixtures/semantic \
            --manifest fixtures/semantic/quality.json

      - name: Enforce incremental visibility budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          source = pathlib.Path("fixtures/semantic/main.ts")
          source.write_text(source.read_text() + "\n// incremental CI edit\n")
          result = subprocess.run(
              ["cargo", "run", "--quiet", "--locked", "--", "sync", "fixtures/semantic"],
              check=True,
              capture_output=True,
              text=True,
          )
          report = json.loads(result.stdout)
          assert report["files_changed"] == 1, report
          assert report["duration_ms"] <= 300, report
          print(json.dumps(report, indent=2))
          PY

      - name: Test benchmark comparator
        run: python3 -m unittest scripts/test_compare_benchmarks.py

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Build release binary
        run: cargo build --release --locked

      - name: Enforce Perseus retrieval advantage
        run: |
          python3 scripts/benchmark_perseus_acceptance.py \
            --structurely target/release/structurely \
            --project . \
            --output /tmp/structurely-perseus-acceptance.json
