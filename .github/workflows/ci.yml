name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Verify semantic quality fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -- init fixtures/semantic
          cargo run --locked -- quality \
            --path fixtures/semantic \
            --manifest fixtures/semantic/quality.json

      - name: Enforce incremental visibility budget
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          source = pathlib.Path("fixtures/semantic/main.ts")
          source.write_text(source.read_text() + "\n// incremental CI edit\n")
          result = subprocess.run(
              ["cargo", "run", "--quiet", "--locked", "--", "sync", "fixtures/semantic"],
              check=True,
              capture_output=True,
              text=True,
          )
          report = json.loads(result.stdout)
          assert report["files_changed"] == 1, report
          assert report["duration_ms"] <= 300, report
          print(json.dumps(report, indent=2))
          PY

      - name: Test benchmark comparator
        if: runner.os == 'Linux'
        run: python3 -m unittest scripts/test_compare_benchmarks.py

      - name: Check documentation
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py

      - name: Build release binary
        run: cargo build --release --locked
